[package]
name = "crustacean"
version = "3.2.1"
edition = "2024"
description = "Crustacean: a snake game in Rust, and a client for OpenSnake servers"
license = "GPL-3.0-or-later"

[[bin]]
name = "crustacean"
path = "src/main.rs"

[lib]
name = "crustacean"
path = "src/lib.rs"

[dependencies]
macroquad = { version = "0.4.16", default-features = false, features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
indexmap = "2"
sha1 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", features = ["json"] }
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
directories = "6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
